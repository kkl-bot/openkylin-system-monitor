name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qtbase5-dev qtdeclarative5-dev libqt5svg5-dev
      - name: Configure
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=ON -DBUILD_PEONY_INTEGRATION_TESTS=OFF
      - name: Build
        run: cmake --build build-ci --parallel 4
      - name: Test collectors, application and widget backend
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-ci --output-on-failure
      - name: Validate metadata and source distribution
        run: python3 scripts/prepare-release.py
